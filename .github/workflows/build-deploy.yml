name: Build and Deploy Codebase  #Name of our github workflow

on: [push, pull_request]  #This tells GitHub when to run the workflow.

jobs:
  job1:
    environment:
      name : testing
    env:
      DATABASE_HOST :  ${{secrets.DATABASE_HOST}}
      DATABASE_PORT : ${{secrets.DATABASE_PORT}}
      DATABASE_NAME : ${{secrets.DATABASE_NAME}}
      DATABASE_USER : ${{secrets.DATABASE_USER}}
      DATABASE_PASSWORD : ${{secrets.DATABASE_PASSWORD}}
      ACCESS_KEY : ${{secrets.ACCESS_KEY}}
      ALGORITHM : ${{secrets.ALGORITHM}}
      ACCESS_TOKEN_EXPIRE_MINUTES : ${{secrets.ACCESS_TOKEN_EXPIRE_MINUTES}}
    runs-on: ubuntu-latest  #GitHub starts a fresh Ubuntu virtual machine to execute this job.

    steps:
      - name: Pull git repository
        uses: actions/checkout@v2  #This downloads (checks out) our GitHub repository into the runner so the workflow has access to your project files.
      - name : Install python version 3.12
        uses : actions/setup-python@v2
        with:
          python-version: "3.12"
      - name: Update pip
        run : python -m pip install --upgrade pip
      - name : Install all dependencies
        run : pip install -r requirements.txt
